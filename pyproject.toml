[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gst-tax-mcp"
version = "0.1.0"
description = "MCP server with nine deterministic Indian GST and income-tax crossover tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Zoeb Nomi" }]
keywords = ["mcp", "gst", "india", "tax", "model-context-protocol"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["mcp>=1.2.0,<2"]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2.60",
  "langchain-mcp-adapters>=0.1.0",
  "langchain-openai>=0.3.0",
]
dev = ["pytest>=7"]

[project.scripts]
gst-tax-mcp = "gst_mcp.server:main"

[project.urls]
Homepage = "https://github.com/zoeb-nomi/gst-tax-mcp"
Repository = "https://github.com/zoeb-nomi/gst-tax-mcp"

[tool.hatch.build.targets.wheel]
packages = ["gst_mcp"]

[tool.hatch.build.targets.sdist]
include = ["gst_mcp", "tests", "fixtures", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
